name: merch_mobile
description: Retail VM mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10
  cloud_functions: ^5.6.2
  cloud_firestore: ^5.6.12
  connectivity_plus: ^6.1.5
  image_picker: ^1.2.2
  cached_network_image: ^3.3.1
  uuid: ^4.4.2
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.1
  collection: ^1.18.0
  riverpod: ^2.6.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/silhouettes/
    - assets/silhouettes/shoulder_out/
    - assets/silhouettes/folded/
